<style>
/* Layout: eine vertikale Sternenkarte als Hauptmenü, Spiele als zentrierte Karten (max. 820px) über einem Sternenhimmel. Bewusst ein einziges dunkles Weltraum-Design. */
:root {
  --bg: #090b22;
  --bg2: #10143b;
  --panel: #161a4a;
  --panel2: #1f2566;
  --line: #2f3786;
  --ink: #f2f3ff;
  --muted: #a4a9e0;
  --nova: #ffd23f;
  --nova-ink: #2a1d00;
  --plasma: #ff4fa3;
  --ion: #3de8c7;
  --flare: #ff6b5b;
  --violet: #8b7bff;
  --s1: #2a3192;
  --s2: #222977;
  --s3: #333ca8;
  --f-display: 'Bungee', 'Impact', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 18px;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.45; min-height: 100%; overflow-x: hidden; }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--nova); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 900; }

/* ---------- Kopfzeile ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(9, 11, 34, .88); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 860px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 17px; letter-spacing: .02em; background: none; border: 0; padding: 0; }
.logo svg { width: 30px; height: 30px; }
.logo span em { font-style: normal; color: var(--nova); }
.lv { display: flex; align-items: center; gap: 8px; margin-left: auto; min-width: 0; }
.lv-num { font-family: var(--f-display); font-size: 13px; background: var(--violet); color: #fff; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.xpbar { width: 80px; height: 8px; border-radius: 9px; background: var(--panel2); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--plasma)); transition: width .5s; }
.cr { font-weight: 900; color: var(--nova); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cr::before { content: '◆ '; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 17px; display: grid; place-items: center; flex: none; }
.iconbtn:hover { background: var(--panel2); }
.top-btns { display: flex; gap: 6px; }
@media (max-width: 560px) { .logo span { display: none; } .xpbar { width: 48px; } .top-in { gap: 6px; } .iconbtn { width: 34px; height: 34px; } }

/* ---------- Grundlayout ---------- */
#app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 80px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 22px; border-radius: 14px; border: 0; background: var(--nova); color: var(--nova-ink); font-weight: 900; font-size: 17px; box-shadow: 0 5px 0 #b8890c; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b8890c; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.sec { background: var(--panel2); color: var(--ink); box-shadow: 0 5px 0 #0c0f33; border: 1px solid var(--line); }
.btn.pink { background: var(--plasma); color: #fff; box-shadow: 0 5px 0 #a4235f; }
.btn.good { background: var(--ion); color: #032b24; box-shadow: 0 5px 0 #1b8c76; }
.btn.bad { background: var(--flare); color: #3a0702; box-shadow: 0 5px 0 #a8382d; }
.back { background: none; border: 0; color: var(--muted); font-weight: 900; padding: 6px 0; margin-bottom: 8px; }
.back:hover { color: var(--ink); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.sm { font-size: .82em; color: var(--muted); }

/* ---------- Pi-Pi ---------- */
.pipi { width: 100%; height: 100%; overflow: visible; }
.pp-skin { fill: var(--ion); }
.pp-belly { fill: #b6fff0; opacity: .55; }
.pp-eye { fill: #fff; }
.pp-pupil { fill: #14163a; transition: transform .2s; }
.pp-ant { stroke: var(--ion); stroke-width: 4; stroke-linecap: round; }
.pp-ball { fill: var(--plasma); }
.pp-mouth { fill: none; stroke: #0b3a33; stroke-width: 4; stroke-linecap: round; }
.pp-arm { fill: none; stroke: var(--ion); stroke-width: 7; stroke-linecap: round; }
.pipi .pp-body { transform-origin: 50px 100px; animation: bob 2.6s ease-in-out infinite; }
.pipi.happy .pp-body { animation: hop .5s ease 2; }
.pipi.sad .pp-body { animation: wob .4s ease 2; }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes hop { 50% { transform: translateY(-14px) scale(1.04, .96); } }
@keyframes wob { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.bubble { position: relative; background: var(--ink); color: #16183f; border-radius: 16px; padding: 10px 14px; font-weight: 700; font-size: 15px; min-width: 0; }
.bubble::before { content: ''; position: absolute; left: -9px; top: 18px; border: 9px solid transparent; border-left: 0; border-right-color: var(--ink); }
.bubble b { color: #5a2fd6; }

/* ---------- Sternenkarte ---------- */
.hero { display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: center; margin-bottom: 14px; }
.hero h1 { font-family: var(--f-display); font-size: clamp(26px, 6vw, 44px); line-height: 1; letter-spacing: .01em; }
.hero h1 span { color: var(--nova); display: block; font-size: .55em; letter-spacing: .08em; }
.hero p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
.hero .pp-big { width: 110px; height: 120px; cursor: pointer; background: none; border: 0; padding: 0; }
.joke { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin: 0 0 16px; }
.joke .bubble { margin-left: 8px; }
.cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 8px; }
.mission { display: flex; gap: 12px; align-items: center; }
.mission .mi-ico { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: var(--panel2); }
.mission .mi-txt { min-width: 0; flex: 1; }
.mission .mi-bar { height: 8px; background: var(--panel2); border-radius: 9px; overflow: hidden; margin-top: 6px; }
.mission .mi-bar i { display: block; height: 100%; background: var(--ion); }
.mission.done .mi-ico { background: var(--ion); }
.map { position: relative; margin-top: 10px; overflow-x: clip; }
.map svg.path { position: absolute; inset: 0; width: 100%; height: 100%; }
.map svg.path path { fill: none; stroke: var(--line); stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
.pl { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 4px; width: 150px; }
.pl .pl-name { font-family: var(--f-display); font-size: 14px; text-align: center; line-height: 1.1; }
.pl .pl-sub { font-size: 13px; color: var(--muted); font-weight: 700; }
.pl:hover .orb { transform: scale(1.07) rotate(-4deg); }
.orb { --sz: 92px; --sat: 1; position: relative; display: block; width: var(--sz); height: var(--sz); border-radius: 50%;
  background: radial-gradient(circle at 30% 28%, hsl(var(--h) 100% 82% / .9) 0 8%, transparent 9%),
    radial-gradient(circle at 64% 64%, hsl(var(--h) 60% 30% / .55) 0 11%, transparent 12%),
    radial-gradient(circle at 30% 70%, hsl(var(--h) 60% 30% / .4) 0 7%, transparent 8%),
    radial-gradient(circle at 35% 32%, hsl(var(--h) 95% 72%), hsl(var(--h) 80% 52%) 48%, hsl(var(--h) 75% 22%) 100%);
  box-shadow: inset -10px -12px 22px rgba(0, 0, 0, .45), 0 0 34px hsl(var(--h) 90% 60% / .35);
  filter: saturate(var(--sat)); transition: transform .25s, filter .4s; }
.orb.ringed::after { content: ''; position: absolute; left: -22%; right: -22%; top: 40%; height: 22%; border-radius: 50%; border: 5px solid hsl(var(--h) 90% 75% / .75); transform: rotate(-16deg); border-top-color: transparent; }
.orb.moon { --h: 230; background: radial-gradient(circle at 60% 40%, #8c90b8 0 10%, transparent 11%), radial-gradient(circle at 35% 65%, #7b7fa8 0 13%, transparent 14%), radial-gradient(circle at 35% 32%, #f1f2ff, #b9bce0 50%, #4a4e80 100%); }
.pl.locked .orb { filter: grayscale(1) brightness(.45); }
.pl.locked .pl-name { color: var(--muted); }
.pl.fixed .orb { box-shadow: inset -10px -12px 22px rgba(0, 0, 0, .4), 0 0 0 3px var(--nova), 0 0 44px hsl(var(--h) 95% 60% / .7); }
.pl .crown { position: absolute; top: -6px; right: 28px; font-size: 22px; }
.pl.final .orb { background: none; box-shadow: none; }
.pw > svg, .orb > svg, .prev > svg { width: 100%; height: 100%; display: block; }
.ship { position: absolute; width: 54px; height: 54px; transform: translate(-50%, -50%) rotate(35deg); animation: shipbob 2.4s ease-in-out infinite; pointer-events: none; filter: drop-shadow(0 0 8px rgba(255, 210, 63, .5)); }
@keyframes shipbob { 50% { transform: translate(-50%, calc(-50% - 7px)) rotate(28deg); } }

/* ---------- Planet-Bildschirm ---------- */
.ph { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; margin-bottom: 16px; }
.ph .orb { --sz: 110px; }
.ph h1 { font-family: var(--f-display); font-size: clamp(26px, 6vw, 40px); line-height: 1.05; }
.ph p { margin: 4px 0 8px; color: var(--muted); font-weight: 700; }
.prog { height: 10px; background: var(--panel2); border-radius: 9px; overflow: hidden; max-width: 320px; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--nova), var(--plasma)); }
.pl-intro { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; margin-bottom: 16px; }
.pl-intro .pw { width: 64px; height: 70px; }
.diff { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 5px; margin-bottom: 16px; }
.diff button { border: 0; background: none; border-radius: 12px; padding: 8px 4px; font-weight: 900; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.diff button small { font-weight: 700; color: var(--muted); font-size: 12px; }
.diff button[aria-checked="true"] { background: var(--nova); color: var(--nova-ink); }
.diff button[aria-checked="true"] small { color: #5a4300; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.gcard { text-align: left; display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; transition: transform .15s, border-color .15s; }
.gcard:hover { transform: translateY(-3px); border-color: hsl(var(--h) 80% 65%); }
.gcard .gi { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; background: hsl(var(--h) 60% 30% / .6); }
.gcard h3 { font-size: 17px; font-weight: 900; }
.gcard p { margin: 2px 0 6px; font-size: 14px; color: var(--muted); }
.stars { color: var(--nova); letter-spacing: 2px; font-size: 15px; }
.stars .off { color: var(--line); }
.bosscard { margin-top: 16px; display: grid; grid-template-columns: 90px 1fr; gap: 16px; align-items: center; background: linear-gradient(135deg, #3a0f2e, var(--panel)); border: 1px solid #7a2457; border-radius: var(--r); padding: 16px; }
.bosscard h3 { font-family: var(--f-display); font-size: 20px; }
.bosscard p { margin: 4px 0 12px; color: var(--muted); }
.bosscard .bot { width: 90px; height: 90px; }
.bosscard.beaten { background: linear-gradient(135deg, #0f3a33, var(--panel)); border-color: var(--ion); }

/* ---------- Spiel ---------- */
.g-top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.g-name { font-family: var(--f-display); font-size: clamp(16px, 4vw, 22px); line-height: 1.1; }
.combo { font-family: var(--f-display); color: var(--nova); background: #3a2a00; border-radius: 999px; padding: 4px 12px; animation: pop .3s; white-space: nowrap; }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.2); } }
.g-status { margin: 12px 0; display: flex; flex-direction: column; gap: 8px; }
.pbar { display: flex; gap: 5px; }
.pbar span { flex: 1; height: 9px; border-radius: 9px; background: var(--panel2); }
.pbar span.ok { background: var(--ion); }
.pbar span.no { background: var(--flare); }
.pbar span.cur { background: var(--muted); }
.bossrow { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; }
.bossrow .bot { width: 54px; height: 54px; }
.bossrow .bot.hit { animation: hit .4s; }
@keyframes hit { 20% { transform: translateX(-8px) rotate(-8deg); filter: brightness(2); } 60% { transform: translateX(6px) rotate(5deg); } }
.hp { height: 14px; background: var(--panel2); border-radius: 9px; overflow: hidden; border: 1px solid #7a2457; }
.hp i { display: block; height: 100%; background: linear-gradient(90deg, var(--flare), var(--plasma)); transition: width .4s; }
.hp-l { font-size: 13px; font-weight: 900; color: var(--muted); margin-bottom: 3px; }
.hearts { font-size: 20px; letter-spacing: 2px; white-space: nowrap; }
.hearts .lost { filter: grayscale(1); opacity: .3; }
.timer { height: 12px; background: var(--panel2); border-radius: 9px; overflow: hidden; }
.timer i { display: block; height: 100%; background: linear-gradient(90deg, var(--ion), var(--nova)); }
.timer-row { display: flex; justify-content: space-between; font-weight: 900; font-variant-numeric: tabular-nums; }
.word { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.word span { width: 38px; height: 46px; border-radius: 10px; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; }
.word span.ok { border: 2px solid var(--ion); background: #0d3b35; animation: pop .35s; }
.word span.no { border: 2px solid var(--flare); background: #3d1512; animation: pop .35s; }
.g-pipi { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; margin-bottom: 12px; }
.g-pipi .pw { width: 54px; height: 60px; }
.task { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px; animation: slidein .35s ease; }
@keyframes slidein { from { opacity: .3; transform: translateY(14px); } }
.task.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.q { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.q .story { display: block; background: var(--panel2); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; font-weight: 600; }
.expr { font-size: clamp(22px, 5.6vw, 32px); font-weight: 900; text-align: center; padding: 10px 0; font-variant-numeric: tabular-nums; overflow-x: auto; }
.visual { margin: 6px 0 14px; display: flex; justify-content: center; overflow-x: auto; }
.system { font-size: 20px; font-weight: 900; text-align: center; background: var(--panel2); border-radius: 14px; padding: 10px 14px; margin: 6px auto; display: inline-flex; flex-direction: column; gap: 4px; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .15em; font-size: .92em; line-height: 1.15; }
.fr > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .2em; }
.fr > span:last-child { padding: 0 .2em; }
.rt { white-space: nowrap; }
.rt .rad { border-top: 2px solid currentColor; padding: 0 .12em; margin-left: .02em; }
.rt .ix { font-size: .6em; margin-right: -.35em; vertical-align: .9em; }
.per { text-decoration: overline; }

/* SVG-Grafiken */
.vis { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.vis.small { max-width: 160px; }
.vis .ln { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.vis .ln.thin { stroke-width: 1.5; }
.vis .ln.thick { stroke-width: 4.5; }
.vis .ln.xthick { stroke-width: 8; }
.vis .ln.mu { stroke: var(--muted); }
.vis .ln.ac { stroke: var(--nova); }
.vis .ln.al { stroke: var(--ion); }
.vis .ln.dark { stroke: #5a2c00; }
.vis .fl1 { fill: var(--s1); }
.vis .fl2 { fill: var(--s2); }
.vis .fl3 { fill: var(--s3); }
.vis .fla { fill: var(--nova); fill-opacity: .55; stroke: var(--nova); stroke-width: 2.5; }
.vis .tx { fill: var(--ink); font: 700 15px var(--f-body); }
.vis .tx.sm { font-size: 13px; }
.vis .tx.xs { font-size: 11px; }
.vis .tx.b { font-weight: 900; }
.vis .tx.it { font-style: italic; }
.vis .tx.ac { fill: var(--nova); }
.vis .tx.dark { fill: #4a2300; }
.vis .dotc { fill: var(--ink); }
.vis .dota { fill: var(--nova); }
.vis .alien { fill: var(--ion); }
.vis .eye { fill: #fff; }
.vis .pupil { fill: #14163a; }
.vis .crust { fill: #c9772f; }
.vis .cheese { fill: #ffcd5a; }
.vis .topping { fill: #d8432f; }
.vis .slice { fill: #ffe08a; stroke: #c9772f; stroke-width: 3; }
.vis .donut { fill: #ff8fc4; }
.vis .planetfill { fill: var(--violet); }
.vis .sat { fill: #dfe3ff; }
.vis .cone { fill: #d99a55; }
.vis .scoop { fill: #ff9ecf; }
.vis .can { fill: #4f5bd0; }
.vis .ball { fill: #ff7a45; }
.vis .hole { fill: var(--bg); }
.vis .bar { fill: var(--violet); }
.grid { stroke: #252c6a; stroke-width: 1; }
.axis { stroke: var(--muted); stroke-width: 1.5; }
.mini { width: 96px; height: 96px; display: block; }
.mini .ln { stroke-width: 3; fill: none; stroke: var(--nova); }
.ico { width: 34px; height: 34px; flex: none; }
.ico .ln { stroke: var(--ink); fill: none; }
.ico .thin { stroke-width: 1.5; }
.ico .fl1 { fill: var(--s1); } .ico .fl2 { fill: var(--s2); } .ico .fl3 { fill: var(--s3); }
.net { height: auto; display: block; }
.netc { fill: var(--s3); stroke: var(--ink); stroke-width: 1.5; }
.plan { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
.pl-grid { display: grid; grid-template-columns: repeat(3, 44px); gap: 3px; }
.pl-grid span { width: 44px; height: 44px; display: grid; place-items: center; background: var(--s2); border: 1px solid var(--line); border-radius: 6px; font-weight: 900; font-size: 20px; }
.pl-front { font-size: 12px; font-weight: 900; color: var(--nova); letter-spacing: .1em; }
table.wt, table.ht { border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.wt td, table.wt th { border: 1px solid var(--line); padding: 2px 7px; font-size: 14px; }
table.ht { margin: 0 auto; }
table.ht td, table.ht th { border: 1px solid var(--line); padding: 6px 10px; text-align: center; }
table.ht th { background: var(--panel2); font-size: 14px; }
.bodyl { display: inline-flex; align-items: center; gap: 6px; }

/* Auswahl */
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opts.wide { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { min-height: 56px; padding: 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--panel2); font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; text-align: center; transition: transform .1s, border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--nova); transform: translateY(-2px); }
.opt:disabled { cursor: default; }
.opt.right { background: #0d3b35; border-color: var(--ion); }
.opt.wrong { background: #3d1512; border-color: var(--flare); }
.opt.gone { opacity: .15; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } .opts.wide { grid-template-columns: 1fr 1fr; } }
.steps { display: flex; flex-direction: column; gap: 8px; }
.steps .line { font-size: 20px; font-weight: 800; padding: 10px 14px; border-radius: 14px; background: var(--bg2); text-align: left; border: 2px solid transparent; }
.steps button.line { background: var(--panel2); border-color: var(--line); }
.steps button.line:hover:not(:disabled) { border-color: var(--nova); }
.steps .line.right { border-color: var(--ion); background: #0d3b35; }
.steps .line.wrong { border-color: var(--flare); background: #3d1512; }

/* Eingabe + Tastenfeld */
.fields { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 12px; }
.field { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; }
.inp { width: 150px; min-height: 52px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg2); color: var(--ink); font: 900 22px var(--f-body); text-align: center; font-variant-numeric: tabular-nums; }
.inp.active { border-color: var(--nova); }
.inp.right { border-color: var(--ion); background: #0d3b35; }
.inp.wrong { border-color: var(--flare); background: #3d1512; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; max-width: 360px; margin: 0 auto; }
.key { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-weight: 900; font-size: 20px; }
.key:active { background: var(--s3); }
.key.ok { grid-column: span 2; background: var(--nova); color: var(--nova-ink); border: 0; font-size: 18px; }
.key.zero { grid-column: span 2; }

/* Verbinden */
.match { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0 56px; margin-bottom: 14px; touch-action: none; }
.mlines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.mlines line { stroke: var(--nova); stroke-width: 4; stroke-linecap: round; }
.mlines line.tmp { stroke-dasharray: 6 6; opacity: .8; }
.mlines line.right { stroke: var(--ion); }
.mlines line.wrong { stroke: var(--flare); }
.mlines line.show { stroke: var(--ion); stroke-dasharray: 3 7; opacity: .9; }
.mcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mi { position: relative; min-height: 58px; padding: 8px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel2); font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; touch-action: none; user-select: none; -webkit-user-select: none; }
.mi .mtxt { min-width: 0; text-align: center; }
.mi .dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 3px solid var(--nova); top: 50%; transform: translateY(-50%); }
.ml .mi .dot { right: -9px; }
.mr .mi .dot { left: -9px; }
.mi.sel { border-color: var(--nova); box-shadow: 0 0 0 3px rgba(255, 210, 63, .25); }
.mi.linked { border-color: var(--s3); }
.mi.linked .dot { background: var(--nova); }
@media (max-width: 520px) { .match { gap: 0 40px; } .mi { font-size: 14px; padding: 6px 8px; } }

/* Sortieren in Fächer */
.pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 56px; padding: 10px; border: 2px dashed var(--line); border-radius: 16px; margin-bottom: 12px; }
.chip { min-height: 46px; min-width: 56px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--s3); background: var(--panel2); font-weight: 900; font-size: 18px; touch-action: none; user-select: none; -webkit-user-select: none; }
.chip.sel { border-color: var(--nova); background: #3a2f00; }
.chip.dragging { position: relative; z-index: 30; box-shadow: 0 10px 24px rgba(0, 0, 0, .5); border-color: var(--nova); }
.chip.right { border-color: var(--ion); background: #0d3b35; }
.chip.wrong { border-color: var(--flare); background: #3d1512; }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
.bin { min-height: 110px; border-radius: 18px; background: var(--bg2); border: 2px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: border-color .15s, background .15s; }
.bin.hot { border-color: var(--nova); background: #241f05; }
.bin-l { font-size: 13px; font-weight: 900; color: var(--muted); text-align: center; }
.bin-c { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.bin-c .chip { font-size: 16px; min-height: 40px; }

/* Wischen */
.swipe-wrap { position: relative; display: flex; justify-content: center; padding: 6px 0 14px; }
.swipe-card { width: min(100%, 380px); min-height: 170px; border-radius: 24px; background: linear-gradient(160deg, var(--s3), var(--panel2)); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; font-size: 21px; font-weight: 800; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; transition: box-shadow .15s; }
.swipe-card.l { box-shadow: -10px 0 0 var(--flare); }
.swipe-card.r { box-shadow: 10px 0 0 var(--ion); }
.swipe-card.fly { transition: transform .35s ease-in, opacity .35s; opacity: 0; }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 380px; margin: 0 auto; }
.hint-s { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0 0; }

/* Memory */
.memo { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.mcard { min-height: 84px; border-radius: 16px; border: 2px solid var(--line); background: repeating-linear-gradient(45deg, var(--panel2) 0 10px, var(--s2) 10px 20px); font-weight: 900; font-size: 17px; padding: 8px; display: grid; place-items: center; transition: transform .25s, background .2s; }
.mcard .face { display: none; }
.mcard .back { font-family: var(--f-display); font-size: 26px; color: var(--muted); }
.mcard.open, .mcard.done { background: var(--panel2); transform: rotateY(0); }
.mcard.open .face, .mcard.done .face { display: block; }
.mcard.open .back, .mcard.done .back { display: none; }
.mcard.open { border-color: var(--nova); }
.mcard.done { border-color: var(--ion); background: #0d3b35; }
.mcard.miss { border-color: var(--flare); }
.memo-info { text-align: center; color: var(--muted); font-weight: 700; margin-top: 10px; }
@media (max-width: 420px) { .memo { grid-template-columns: 1fr 1fr; } .mcard { font-size: 15px; } }

/* Zahlenstrahl, Laser, Raster */
.nl { width: 100%; max-width: 520px; display: block; margin: 0 auto 12px; touch-action: none; cursor: crosshair; }
.nl .tick { stroke: var(--muted); stroke-width: 2; }
.nl .base { stroke: var(--ink); stroke-width: 3; }
.nl .num { fill: var(--ink); font: 800 14px var(--f-body); }
.nl .mk { fill: var(--nova); }
.nl .true { fill: var(--ion); }
.nl .truel { fill: var(--ion); font: 900 14px var(--f-body); }
.center { text-align: center; }
.gridsvg { width: 100%; max-width: 360px; display: block; margin: 0 auto 12px; touch-action: none; }
.gridsvg .num { fill: var(--muted); font: 700 10px var(--f-body); }
.gridsvg .ast { fill: #b48a6a; stroke: #6d4b33; stroke-width: 2; }
.gridsvg .ast.boom { fill: var(--nova); animation: boom .6s forwards; transform-box: fill-box; transform-origin: center; }
@keyframes boom { to { transform: scale(2.4); opacity: 0; } }
.gridsvg .laser { stroke: var(--plasma); stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 4px var(--plasma)); }
.gridsvg .aim { stroke: var(--plasma); stroke-width: 2; stroke-dasharray: 5 6; opacity: .6; }
.gridsvg .gl { stroke: var(--nova); stroke-width: 3; }
.gridsvg .gl2 { stroke: var(--plasma); stroke-width: 3; }
.gridsvg .eqt { font: 900 13px var(--f-body); }
.gridsvg .mk { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.gridsvg .true { fill: var(--ion); }
.sliders { display: grid; gap: 10px; max-width: 420px; margin: 0 auto 12px; }
.slider { display: grid; grid-template-columns: 34px 1fr 52px; gap: 10px; align-items: center; font-weight: 900; font-size: 18px; }
.slider input { width: 100%; accent-color: var(--nova); height: 30px; }
.slider output { text-align: right; font-variant-numeric: tabular-nums; }
.eqline { text-align: center; font-size: 22px; font-weight: 900; margin-bottom: 12px; color: var(--plasma); }

/* Waage */
.bal { width: 100%; max-width: 440px; display: block; margin: 0 auto 8px; }
.bal .beam { transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 220px 70px; transform-box: view-box; }
.bal.tilt .beam { animation: tilt 1s ease; }
@keyframes tilt { 25% { transform: rotate(-14deg); } 60% { transform: rotate(9deg); } }
.bal .pan { fill: var(--s3); stroke: var(--ink); stroke-width: 2; }
.bal .stand { fill: var(--s1); }
.bal .rope { stroke: var(--muted); stroke-width: 2; }
.bal .bar2 { stroke: var(--nova); stroke-width: 6; stroke-linecap: round; }
.bal .ex { fill: var(--ink); font: 900 20px var(--f-body); }
.hist { display: flex; flex-direction: column; gap: 2px; align-items: center; font-size: 15px; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
.hist .act { color: var(--nova); font-size: 13px; }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 520px) { .moves { grid-template-columns: 1fr; } }

/* Reihenfolge */
.order { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.ordb { position: relative; min-height: 76px; border-radius: 16px; border: 2px solid var(--line); background: var(--panel2); padding: 10px; font-size: 16px; }
.ordb .n { position: absolute; top: -10px; left: -8px; width: 30px; height: 30px; border-radius: 50%; background: var(--nova); color: var(--nova-ink); font-weight: 900; display: grid; place-items: center; }
.ordb.right { border-color: var(--ion); }
.ordb.wrong { border-color: var(--flare); }

.tapsvg .hit { stroke: transparent; stroke-width: 28; cursor: pointer; pointer-events: stroke; }
.tapsvg .side.hl { stroke: var(--nova); stroke-width: 5; }
.tapsvg .side.right { stroke: var(--ion); stroke-width: 7; }
.tapsvg .side.wrong { stroke: var(--flare); stroke-width: 7; }

.check { display: flex; margin: 4px auto 0; }

/* Joker */
.jokers { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.jk { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-weight: 900; font-size: 14px; min-height: 40px; }
.jk:disabled { opacity: .35; cursor: not-allowed; }
.jk-n { color: var(--muted); font-size: 13px; font-weight: 800; align-self: center; }

/* Rückmeldung */
.fb { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); animation: up .3s ease; }
@keyframes up { from { transform: translateY(100%); } }
.fb-in { max-width: 820px; margin: 0 auto; border-radius: 22px 22px 18px 18px; padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; box-shadow: 0 -10px 40px rgba(0, 0, 0, .55); max-height: 70vh; overflow-y: auto; }
.fb-in.ok { background: #0b3d36; border: 2px solid var(--ion); }
.fb-in.no { background: #3f1714; border: 2px solid var(--flare); }
.fb-h { font-family: var(--f-display); font-size: 20px; }
.fb-in.ok .fb-h { color: var(--ion); }
.fb-in.no .fb-h { color: #ffb3aa; }
.fb-x { grid-column: 1 / -1; font-size: 16px; line-height: 1.6; background: rgba(0, 0, 0, .25); border-radius: 12px; padding: 10px 12px; }
.fb-x[hidden] { display: none; }
.fb .xp { color: var(--nova); font-weight: 900; }
.fb-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.linkbtn { background: none; border: 0; color: var(--ink); text-decoration: underline; font-weight: 800; padding: 6px; }

/* Ergebnis, Shop, Erfolge, Eltern */
.result { text-align: center; padding: 26px 18px; }
.result h2 { font-family: var(--f-display); font-size: clamp(26px, 6vw, 40px); }
.bigstars { font-size: 54px; letter-spacing: 6px; margin: 10px 0; }
.bigstars span { display: inline-block; animation: pop .5s backwards; }
.bigstars .off { filter: grayscale(1); opacity: .25; }
.rstats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 14px 0 20px; }
.rstats div { background: var(--panel2); border-radius: 14px; padding: 10px 16px; min-width: 110px; }
.rstats b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.rstats span { font-size: 13px; color: var(--muted); font-weight: 700; }
.ractions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.result .pw { width: 110px; height: 120px; margin: 0 auto; }
.sec-h { font-family: var(--f-display); font-size: 26px; margin: 4px 0 4px; }
.sec-p { color: var(--muted); margin: 0 0 16px; }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.item .prev { width: 90px; height: 90px; }
.item .nm { font-weight: 900; }
.item .btn { min-height: 40px; font-size: 15px; padding: 6px 14px; width: 100%; }
.item.eq { border-color: var(--nova); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.badge { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.badge .bi { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: var(--panel2); }
.badge.got .bi { background: radial-gradient(circle, #ffe680, var(--nova)); box-shadow: 0 0 16px rgba(255, 210, 63, .5); }
.badge:not(.got) { opacity: .55; }
.badge b { display: block; }
.badge span { font-size: 13px; color: var(--muted); }
.statrow { display: grid; grid-template-columns: 140px 1fr 70px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.statrow .sb { height: 12px; border-radius: 9px; background: var(--panel2); overflow: hidden; display: flex; }
.statrow .sb .c { background: var(--ion); }
.statrow .sb .w { background: var(--flare); }
.statrow .pc { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .statrow { grid-template-columns: 100px 1fr 54px; font-size: 13px; } }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.setrow label { font-weight: 800; }
.txtin { min-height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg2); color: var(--ink); font: 800 18px var(--f-body); padding: 0 12px; width: min(100%, 260px); }
.switch { width: 58px; height: 32px; border-radius: 999px; border: 0; background: var(--panel2); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: #0d3b35; }
.switch[aria-checked="true"]::after { transform: translateX(26px); background: var(--ion); }
.weak { background: var(--panel2); border-radius: 14px; padding: 12px 14px; margin: 10px 0 16px; }
.section { margin-bottom: 22px; }

/* Urkunde */
.cert { position: relative; max-width: 620px; margin: 10px auto; background: #fff8e6; color: #2b2210; border-radius: 10px; padding: 34px 26px; text-align: center; border: 10px double #c79a2b; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.cert h2 { font-family: var(--f-display); font-size: clamp(28px, 7vw, 46px); color: #8a5a00; letter-spacing: .05em; }
.cert .who { font-family: var(--f-display); font-size: clamp(22px, 6vw, 34px); color: #5a2fd6; margin: 14px 0 6px; overflow-wrap: anywhere; }
.cert p { margin: 6px auto; max-width: 44ch; font-size: 17px; }
.cert .seal { width: 90px; height: 90px; margin: 14px auto 0; border-radius: 50%; background: radial-gradient(circle, #ffd96b, #c79a2b); display: grid; place-items: center; font-size: 40px; box-shadow: 0 4px 0 #8a6a12; }
.cert .meta { font-size: 14px; color: #6b5a33; margin-top: 12px; }

/* Overlays */
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(4, 5, 20, .78); display: grid; place-items: center; padding: 16px; }
.modal-in { width: min(100%, 440px); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 22px; text-align: center; }
.modal-in h2 { font-family: var(--f-display); font-size: 24px; margin-bottom: 8px; }
.modal-in p { color: var(--muted); }
.modal-in .pw { width: 90px; height: 100px; margin: 0 auto 6px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: #16183f; border-radius: 16px; padding: 10px 16px; font-weight: 800; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); max-width: calc(100% - 32px); display: flex; gap: 10px; align-items: center; animation: toastin .35s; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, -16px); } }
.toast .ti { font-size: 26px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}

.opt .vis { max-width: 150px; }

/* Accounts */
.iconbtn.acc { position: relative; }
.iconbtn.acc::after { content: ''; position: absolute; right: 3px; bottom: 3px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--bg); background: var(--muted); }
.iconbtn.acc[data-sync="ok"]::after { background: var(--ion); }
.iconbtn.acc[data-sync="wait"]::after { background: var(--nova); }
.iconbtn.acc[data-sync="err"]::after { background: var(--flare); }
.iconbtn.acc[data-sync="guest"]::after { display: none; }
.acc-av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--violet); color: #fff; font-weight: 900; font-size: 14px; }
.login { max-width: 460px; margin: 0 auto; padding-top: 10px; display: flex; flex-direction: column; gap: 14px; }

<noscript><p style="color:#fff;padding:20px">Mathe-Galaxie ist ein Mathe-Lernspiel für die 4. Klasse. Bitte aktiviere JavaScript, um zu spielen.</p></noscript>
<script>
'use strict';
/* =====================================================================
   MATHE-GALAXIE – Inhalte & Aufgabengeneratoren
   Jede Aufgabe wird zufällig erzeugt; die Lösung berechnet immer der Code.
   ===================================================================== */

/* ---------- Hilfsfunktionen ---------- */
const R = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: a => a[Math.floor(Math.random() * a.length)],
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  nz(a, b) { let v; do { v = R.int(a, b); } while (v === 0); return v; },
  sample(a, n) { return R.shuffle(a).slice(0, n); },
  chance: p => Math.random() < p
};
const MINUS = '−';
const PI = Math.PI;

function fmt(n, dec = 2) {
  if (typeof n !== 'number' || !isFinite(n)) return String(n);
  let v = Math.round(n * Math.pow(10, dec)) / Math.pow(10, dec);
  if (v === 0) v = 0;
  let s = Math.abs(v).toFixed(dec);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  let [ip, fp] = s.split('.');
  if (ip.length > 4) ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (v < 0 ? MINUS : '') + ip + (fp ? ',' + fp : '');
}
function parseNum(str) {
  if (str == null) return NaN;
  let s = String(str).trim().replace(/[\s ]/g, '').replace(/[−–]/g, '-').replace(/,/g, '.');
  if (s === '') return NaN;
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (m) return parseFloat(m[1]) / parseFloat(m[2]);
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}
const sg = n => '(' + (n < 0 ? MINUS : '+') + Math.abs(n) + ')';
const frac = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const rt = x => `<span class="rt">√<span class="rad">${x}</span></span>`;
const cbrt = x => `<span class="rt"><sup class="ix">3</sup>√<span class="rad">${x}</span></span>`;
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const sq = '²', cu = '³';

function mono(c, v, first) {
  if (c === 0) return '';
  const a = Math.abs(c);
  const body = (a === 1 && v ? '' : fmt(a)) + v;
  if (first) return (c < 0 ? MINUS : '') + body;
  return (c < 0 ? ' ' + MINUS + ' ' : ' + ') + body;
}
function poly(terms) {
  let s = '', first = true;
  for (const [c, v] of terms) { if (c === 0) continue; s += mono(c, v, first); first = false; }
  return s || '0';
}
const px = (c2, c1, c0) => poly([[c2, 'x²'], [c1, 'x'], [c0, '']]);
const lin = (k, d, v = 'x') => poly([[k, v], [d, '']]);
const signed = n => (n < 0 ? ' ' + MINUS + ' ' : ' + ') + fmt(Math.abs(n));

/* Antwortfelder */
const exact = (answer, unit = '', label = '') => ({ answer, tol: 1e-6, unit, label });
const round2 = (answer, unit = '', label = '') => ({ answer, tol: 0.011, unit, label, round: 2 });
const round1 = (answer, unit = '', label = '') => ({ answer, tol: 0.051, unit, label, round: 1 });
const piF = (answer, unit = '', label = '') => ({ answer, tol: Math.max(0.02, Math.abs(answer) * 0.012), unit, label, round: 2 });

/* Auswahl-Optionen: korrekte Antwort zuerst, Duplikate raus, auf 4 auffüllen */
function mkOpts(correct, cands, fill) {
  const out = [correct];
  for (const c of cands) { if (out.length >= 4) break; if (c != null && c !== '' && !out.includes(c)) out.push(c); }
  let guard = 0;
  while (out.length < 4 && fill && guard++ < 80) { const c = fill(); if (c != null && !out.includes(c)) out.push(c); }
  return out;
}
function choice(q, correct, cands, extra = {}) {
  const { fill, ...rest } = extra;
  return Object.assign({ type: 'choice', q, options: mkOpts(correct, cands, fill), correct: 0 }, rest);
}
const svg = (w, h, inner, cls = '') => `<svg viewBox="0 0 ${w} ${h}" class="vis ${cls}" role="img" aria-hidden="true">${inner}</svg>`;
const T = (x, y, s, cls = 'tx', anchor = 'middle') => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="${cls}" text-anchor="${anchor}" dominant-baseline="middle">${s}</text>`;
const L = (x1, y1, x2, y2, cls = 'ln') => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="${cls}"/>`;
function unused(ctx, pool, keyFn = x => x) {
  const fresh = pool.filter(p => !ctx.used.has(keyFn(p)));
  const p = R.pick(fresh.length ? fresh : pool);
  ctx.used.add(keyFn(p));
  return p;
}

/* =====================================================================
   PLANET 1 – Startrampe (Wiederholung 3. Klasse)
   ===================================================================== */
function genSigned(lvl) {
  let expr, ans, exp, step;
  if (lvl === 1) {
    const a = R.nz(-20, 20), b = R.nz(-20, 20), plus = R.chance(.5);
    ans = plus ? a + b : a - b;
    expr = `${sg(a)} ${plus ? '+' : MINUS} ${sg(b)}`;
    if (plus) {
      step = b > 0 ? `Plus eine positive Zahl: ${Math.abs(b)} Schritte nach rechts.` : `Plus eine negative Zahl ist dasselbe wie minus ${Math.abs(b)}.`;
      exp = `${expr} = ${fmt(a)} ${b < 0 ? MINUS : '+'} ${Math.abs(b)} = <b>${fmt(ans)}</b>`;
    } else {
      step = `Minus vor der Klammer dreht das Vorzeichen: aus ${MINUS} ${sg(b)} wird ${b < 0 ? '+' : MINUS} ${Math.abs(b)}.`;
      exp = `${expr} = ${fmt(a)} ${b < 0 ? '+' : MINUS} ${Math.abs(b)} = <b>${fmt(ans)}</b>`;
    }
  } else if (lvl === 2) {
    if (R.chance(.5)) { const a = R.nz(-12, 12), b = R.nz(-12, 12); ans = a * b; expr = `${sg(a)} · ${sg(b)}`; }
    else { const b = R.nz(-12, 12), q = R.nz(-12, 12); ans = q; expr = `${sg(b * q)} : ${sg(b)}`; }
    step = 'Gleiche Vorzeichen ergeben Plus, verschiedene Vorzeichen ergeben Minus.';
    exp = `${expr} = <b>${fmt(ans)}</b> (${ans > 0 ? 'gleiche Vorzeichen → plus' : 'verschiedene Vorzeichen → minus'})`;
  } else {
    const t = R.int(0, 3);
    if (t === 0) { const a = R.nz(-9, 9), b = R.nz(-9, 9), c = R.nz(-20, 20); ans = a * b + c; expr = `${sg(a)} · ${sg(b)} + ${sg(c)}`; step = `Punkt vor Strich: zuerst ${sg(a)} · ${sg(b)} = ${fmt(a * b)}.`; exp = `${sg(a * b)} + ${sg(c)} = <b>${fmt(ans)}</b>`; }
    else if (t === 1) { const b = R.nz(-9, 9), q = R.nz(-9, 9), c = R.nz(-20, 20); ans = c - q; expr = `${sg(c)} ${MINUS} ${sg(b * q)} : ${sg(b)}`; step = `Punkt vor Strich: zuerst ${sg(b * q)} : ${sg(b)} = ${fmt(q)}.`; exp = `${sg(c)} ${MINUS} ${sg(q)} = <b>${fmt(ans)}</b>`; }
    else if (t === 2) { const a = R.nz(-12, 12), b = R.nz(-12, 12), c = R.nz(-6, 6); ans = (a + b) * c; expr = `[${sg(a)} + ${sg(b)}] · ${sg(c)}`; step = `Klammer zuerst: ${sg(a)} + ${sg(b)} = ${fmt(a + b)}.`; exp = `${sg(a + b)} · ${sg(c)} = <b>${fmt(ans)}</b>`; }
    else { const a = R.nz(-9, 9), b = R.nz(-9, 9), c = R.nz(-9, 9), d = R.nz(-9, 9); ans = a * b - c * d; expr = `${sg(a)} · ${sg(b)} ${MINUS} ${sg(c)} · ${sg(d)}`; step = `Zuerst beide Produkte: ${fmt(a * b)} und ${fmt(c * d)}.`; exp = `${sg(a * b)} ${MINUS} ${sg(c * d)} = <b>${fmt(ans)}</b>`; }
  }
  return { type: 'input', q: 'Berechne!', visual: `<div class="expr">${expr} = ?</div>`, fields: [exact(ans)], explain: exp, step, hint: 'Klammer vor Punkt vor Strich. Gleiche Vorzeichen → +, verschiedene Vorzeichen → −.' };
}

const powHtml = (b, e) => `${b < 0 ? `(${MINUS}${-b})` : b}<sup>${e}</sup>`;
const xp = n => n === 1 ? 'x' : (n === 0 ? '1' : `x<sup>${n}</sup>`);
function genPotenz(lvl) {
  const pairs = [], used = new Set();
  const add = (l, r) => { if (used.has(r)) return; used.add(r); pairs.push([l, r]); };
  const powPair = () => { const b = R.pick([2, 3, 4, 5, -2, -3, 10]); const e = Math.abs(b) === 10 ? R.int(2, 5) : R.int(2, Math.abs(b) <= 3 ? 5 : 3); add(powHtml(b, e), fmt(Math.pow(b, e))); };
  const rulePair = () => {
    const t = R.int(0, 4); let a = R.int(2, 6); const b = R.int(2, 5);
    if (t === 0) add(`${xp(a)} · ${xp(b)}`, xp(a + b));
    else if (t === 1) { if (a <= b) a = b + R.int(1, 3); add(`${xp(a)} : ${xp(b)}`, xp(a - b)); }
    else if (t === 2) add(`(${xp(a)})<sup>${b}</sup>`, xp(a * b));
    else if (t === 3) { const k = R.int(2, 5); add(`(${k}x)<sup>2</sup>`, `${k * k}x<sup>2</sup>`); }
    else { const k = R.int(2, 9); add(`${MINUS}${k}<sup>2</sup>`, fmt(-k * k)); }
  };
  const sciPair = () => { const m = R.pick([1.5, 2, 2.5, 3.2, 4, 6.4, 7, 8.1]); const e = R.pick([-3, -2, -1, 2, 3, 4, 5]); add(`${fmt(m)} · 10<sup>${e < 0 ? MINUS + (-e) : e}</sup>`, fmt(m * Math.pow(10, e), 6)); };
  let g = 0;
  while (pairs.length < 4 && g++ < 300) {
    if (lvl === 1) powPair(); else if (lvl === 2) (R.chance(.75) ? rulePair : powPair)(); else (R.chance(.5) ? sciPair : rulePair)();
  }
  return { type: 'match', q: 'Verbinde jede Potenz mit ihrem Wert!', left: pairs.map(p => p[0]), right: pairs.map(p => p[1]),
    hint: 'Gleiche Basis: beim Multiplizieren Hochzahlen addieren, beim Dividieren subtrahieren, beim Potenzieren multiplizieren.',
    step: `Beispiel: 2<sup>3</sup> = 2 · 2 · 2 = 8 und x<sup>2</sup> · x<sup>3</sup> = x<sup>5</sup>.` };
}

function genProzent(lvl) {
  const items = ['Laser-Schwert', 'Jetpack', 'Sternenkarte', 'Raumanzug', 'Alien-Plüschtier', 'Mondstein'];
  const it = R.pick(items);
  if (lvl === 1) {
    const p = R.int(4, 40) * 5, r = R.pick([10, 20, 25, 50, 30, 15]), off = p * r / 100, np = p - off;
    return { type: 'input', q: `Im Weltraum-Shop kostet ein ${it} <b>${fmt(p)} €</b>. Heute gibt es <b>${r} % Rabatt</b>. Wie viel kostet es jetzt?`, fields: [round2(np, '€')],
      explain: `${r} % von ${fmt(p)} € = ${fmt(p)} · ${r} : 100 = ${fmt(off)} €.<br>${fmt(p)} € ${MINUS} ${fmt(off)} € = <b>${fmt(np)} €</b>`,
      hint: 'Rabatt = Grundwert · Prozentsatz : 100', step: `Berechne zuerst den Rabatt: ${fmt(p)} · ${r} : 100.` };
  }
  if (lvl === 2) {
    const p = R.int(4, 40) * 5, r = R.pick([10, 15, 20, 25, 30, 40, 50, 60, 75]), np = p * (100 - r) / 100;
    return { type: 'input', q: `Ein ${it} kostete <b>${fmt(p)} €</b>, jetzt nur noch <b>${fmt(np)} €</b>. Wie viel Prozent Rabatt sind das?`, fields: [round2(r, '%')],
      explain: `Ersparnis: ${fmt(p)} € ${MINUS} ${fmt(np)} € = ${fmt(p - np)} €.<br>${fmt(p - np)} : ${fmt(p)} · 100 = <b>${r} %</b>`,
      hint: 'Prozentsatz = Prozentwert : Grundwert · 100', step: `Wie viele Euro sparst du? ${fmt(p)} ${MINUS} ${fmt(np)}.` };
  }
  const p = R.int(4, 40) * 5;
  if (R.chance(.5)) {
    const r = R.pick([10, 20, 25, 50, 40]), np = p * (100 - r) / 100;
    return { type: 'input', q: `Nach <b>${r} % Rabatt</b> kostet ein ${it} noch <b>${fmt(np)} €</b>. Wie viel kostete es vorher?`, fields: [round2(p, '€')],
      explain: `${fmt(np)} € sind ${100 - r} % vom alten Preis.<br>${fmt(np)} : ${100 - r} · 100 = <b>${fmt(p)} €</b>`,
      hint: 'Der neue Preis entspricht (100 − Rabatt) % des alten Preises.', step: `${fmt(np)} € entsprechen ${100 - r} %. Wie viel ist 1 %?` };
  }
  const r = R.pick([10, 20, 25, 50]), np = p * (100 + r) / 100;
  return { type: 'input', q: `Wegen der Sonnenwind-Saison wurde ein ${it} um <b>${r} %</b> teurer und kostet jetzt <b>${fmt(np)} €</b>. Wie viel kostete es vorher?`, fields: [round2(p, '€')],
    explain: `${fmt(np)} € sind ${100 + r} % vom alten Preis.<br>${fmt(np)} : ${100 + r} · 100 = <b>${fmt(p)} €</b>`,
    hint: 'Nach einer Erhöhung um r % zahlt man (100 + r) %.', step: `${fmt(np)} € entsprechen ${100 + r} %.` };
}

/* =====================================================================
   PLANET 2 – Zahlen-Nebel (rationale, irrationale, reelle Zahlen; Wurzeln)
   ===================================================================== */
const ZOO_BINS = ['ℕ natürlich', 'ℤ ganz, nicht natürlich', 'ℚ rational, nicht ganz', 'irrational'];
const ZOO = [
  ['7', 0, 1], ['12', 0, 1], ['1', 0, 1], ['100', 0, 1], [rt(25), 0, 2], [frac(8, 2), 0, 3], [rt(49), 0, 2],
  [MINUS + '5', 1, 1], [MINUS + '12', 1, 1], [MINUS + '1', 1, 1], [MINUS + rt(9), 1, 2], [MINUS + frac(6, 3), 1, 3],
  [frac(3, 4), 2, 1], ['0,25', 2, 1], [MINUS + '1,5', 2, 1], [frac(7, 2), 2, 1], ['0,<span class="per">3</span>', 2, 2], [MINUS + frac(2, 3), 2, 2], [rt(frac(1, 4)), 2, 3], ['3,14', 2, 3],
  [rt(2), 3, 1], ['π', 3, 1], [rt(10), 3, 1], [`2 + ${rt(3)}`, 3, 2], [cbrt(5), 3, 2], [rt(8), 3, 2], [MINUS + rt(5), 3, 2], ['0,1010010001…', 3, 3]
];
function genZoo(lvl) {
  const pool = ZOO.filter(z => z[2] <= lvl);
  const items = [];
  for (let b = 0; b < 4; b++) items.push(R.pick(pool.filter(z => z[1] === b && !items.includes(z))));
  const rest = R.sample(pool.filter(z => !items.includes(z)), 2);
  return { type: 'bins', q: 'Bring jede Zahl ins <b>kleinste</b> passende Gehege!', bins: ZOO_BINS,
    items: R.shuffle(items.concat(rest)).map(z => ({ html: z[0], bin: z[1] })),
    hint: 'ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. Rechne Wurzeln und Brüche zuerst aus: √25 = 5 ist natürlich!',
    step: 'Frag dich: Kann man die Zahl als Bruch schreiben? Wenn nein → irrational. Wenn ja: ist sie ganz? positiv?' };
}

function genRadar(lvl) {
  let n, v, label, min, tol, why;
  if (lvl === 1) { const k = R.int(1, 12); n = k * k; v = k; label = rt(n); min = Math.max(0, k - 2); tol = .25; why = `${k} · ${k} = ${n}, also ist ${rt(n)} = ${k}.`; }
  else if (lvl === 2) { do { n = R.int(2, 99); } while (Number.isInteger(Math.sqrt(n))); v = Math.sqrt(n); label = rt(n); min = Math.max(0, Math.floor(v) - 1); tol = .2; const f = Math.floor(v); why = `${f}² = ${f * f} < ${n} < ${(f + 1) * (f + 1)} = ${f + 1}², also liegt ${rt(n)} ≈ ${fmt(v)} zwischen ${f} und ${f + 1}.`; }
  else { do { n = R.int(2, 120); } while (Number.isInteger(Math.round(Math.cbrt(n) * 1e6) / 1e6)); v = Math.cbrt(n); label = cbrt(n); min = Math.max(0, Math.floor(v) - 1); tol = .15; const f = Math.floor(v); why = `${f}³ = ${f ** 3} < ${n} < ${(f + 1) ** 3} = ${f + 1}³, also ist ${cbrt(n)} ≈ ${fmt(v)}.`; }
  return { type: 'numberline', q: `Wo liegt ${label}? Setze den Radar-Punkt auf die richtige Stelle!`, label, value: v, min, max: min + 4, tol,
    explain: why, hint: 'Suche die Quadratzahlen (bzw. Kubikzahlen) direkt unter und über der Zahl.', step: why.split(',')[0] + '.' };
}

function genQuadrat(lvl) {
  const t = lvl === 1 ? 0 : lvl === 2 ? 1 : R.int(2, 3);
  if (t === 0) {
    const s = R.int(2, 20), A = s * s;
    return { type: 'input', q: `Ein quadratisches Landefeld hat den Flächeninhalt <b>A = ${fmt(A)} m²</b>. Wie lang ist eine Seite?`, visual: squareSvg(`A = ${fmt(A)} m²`, 's = ?'),
      fields: [exact(s, 'm')], explain: `s = ${rt(fmt(A))} = <b>${s} m</b>, weil ${s} · ${s} = ${A}.`, hint: 'Beim Quadrat ist A = s · s, also s = √A.', step: `Welche Zahl mal sich selbst ergibt ${A}?` };
  }
  if (t === 1) {
    const a = R.int(2, 15), V = a ** 3;
    return { type: 'input', q: `Ein würfelförmiger Frachtcontainer hat das Volumen <b>V = ${fmt(V)} dm³</b>. Wie lang ist eine Kante?`, visual: cubeSvg(`V = ${fmt(V)} dm³`),
      fields: [exact(a, 'dm')], explain: `a = ${cbrt(fmt(V))} = <b>${a} dm</b>, weil ${a} · ${a} · ${a} = ${V}.`, hint: 'Beim Würfel ist V = a · a · a, also a = ∛V.', step: `Welche Zahl dreimal mit sich selbst multipliziert ergibt ${V}?` };
  }
  if (t === 2) {
    let A; do { A = R.int(20, 500); } while (Number.isInteger(Math.sqrt(A)));
    const s = Math.sqrt(A);
    return { type: 'input', q: `Ein quadratisches Solarpaneel hat <b>A = ${A} cm²</b>. Berechne die Seitenlänge (auf 2 Dezimalen).`, visual: squareSvg(`A = ${A} cm²`, 's = ?'),
      fields: [round2(s, 'cm')], explain: `s = ${rt(A)} ≈ <b>${fmt(s)} cm</b>`, hint: 'Nimm den Taschenrechner: s = √A.', step: `s = ${rt(A)}` };
  }
  let V; do { V = R.int(20, 900); } while (Number.isInteger(Math.round(Math.cbrt(V) * 1e6) / 1e6));
  const a = Math.cbrt(V);
  return { type: 'input', q: `Ein Würfel-Tank fasst <b>V = ${V} cm³</b>. Wie lang ist eine Kante (auf 2 Dezimalen)?`, visual: cubeSvg(`V = ${V} cm³`),
    fields: [round2(a, 'cm')], explain: `a = ${cbrt(V)} ≈ <b>${fmt(a)} cm</b>`, hint: 'a = ∛V – am Taschenrechner meist mit der Taste ∛ oder x^(1/3).', step: `a = ${cbrt(V)}` };
}
function squareSvg(lbl, side) {

function triangleGeom() {
  const L1 = R.int(90, 170), L2 = R.int(70, 150), th = Math.random() * PI * 2;

  const pts = [[0, 0], rot([L1, 0]), rot([0, L2])];

  const mnx = Math.min(...xs), mxx = Math.max(...xs), mny = Math.min(...ys), mxy = Math.max(...ys);
  const sc = Math.min(220 / (mxx - mnx), 160 / (mxy - mny), 1.3);
  const ox = 50 + (220 - (mxx - mnx) * sc) / 2, oy = 40 + (160 - (mxy - mny) * sc) / 2;
  return pts.map(p => [ox + (p[0] - mnx) * sc, oy + (p[1] - mny) * sc]);
}

  const lab = (X, n) => { const d = un(sub(X, G)); return T(X[0] + d[0] * 18, X[1] + d[1] * 18, n, 'tx b'); };
  const side = (A, B, id, name) => {
    const hit = opts.tap ? `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" class="hit" data-hit="${id}"/>` : '';
    let nm = '';
    if (name) { const mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2], d = un(sub(mid, G)); nm = T(mid[0] + d[0] * 16, mid[1] + d[1] * 16, name, 'tx ac it'); }
    return `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" class="ln side" data-side="${id}"/>${hit}${nm}`;

  const sn = opts.sideNames || {};

    <polyline points="${r1} ${r2} ${r3}" class="ln thin"/>

function genKlammer(lvl) {

      { fill: () => lin(a * b + R.nz(-2, 2), a * c), explain: `Jeder Summand in der Klammer wird mit ${fmt(a)} multipliziert: ${fmt(a)} · ${mono(b, 'x', true)} = ${mono(a * b, 'x', true)} und ${fmt(a)} · ${fmt(c)} = ${fmt(a * c)}.<br><b>${correct}</b>`,

    { fill: () => `${kx}(${lin(p + R.nz(-2, 2), q)})`, explain: `Beide Glieder enthalten ${kx}: ${mono(k * p, 'x²', true)} = ${kx} · ${mono(p, 'x', true)} und ${mono(k * q, 'x', true)} = ${kx} · ${fmt(q)}.<br><b>${correct}</b><br>Probe: Ausmultiplizieren ergibt wieder ${px(k * p, k * q, 0)}.`,
      hint: 'Suche die größte Zahl und die höchste x-Potenz, die in beiden Gliedern steckt. Mach am Ende die Probe!', step: `Der gemeinsame Faktor ist ${kx}.` });
}

function binomPair(lvl, used) {

    const t = R.int(0, 2), a = R.int(1, 9);

    if (lvl === 1) {

      if (t === 0) { L = `(${bx} + ${aa})²`; Rr = px(b * b, 2 * aa * b, aa * aa); }
      else if (t === 1) { L = `(${bx} ${MINUS} ${aa})²`; Rr = px(b * b, -2 * aa * b, aa * aa); }
      else { L = `(${bx} + ${aa})(${bx} ${MINUS} ${aa})`; Rr = px(b * b, 0, -aa * aa); }
    } else {
      const b = R.int(1, 3), c = R.int(1, 4);
      const bx = b === 1 ? 'x' : `${b}x`, cy = c === 1 ? 'y' : `${c}y`;
      if (t === 0) { L = `(${bx} + ${cy})²`; Rr = poly([[b * b, 'x²'], [2 * b * c, 'xy'], [c * c, 'y²']]); }
      else if (t === 1) { L = `(${bx} ${MINUS} ${cy})²`; Rr = poly([[b * b, 'x²'], [-2 * b * c, 'xy'], [c * c, 'y²']]); }
      else { L = `(${bx} + ${cy})(${bx} ${MINUS} ${cy})`; Rr = poly([[b * b, 'x²'], [-c * c, 'y²']]); }
    }
    if (!used.has(L) && !used.has(Rr)) { used.add(L); used.add(Rr); return [L, Rr]; }
  }
  return null;
}
function genBinom(lvl) {
  const n = lvl === 1 ? 4 : lvl === 2 ? 5 : 6, used = new Set(), pairs = [];
  while (pairs.length < n) { const p = binomPair(lvl, used); if (!p) break; pairs.push(p); }

      hint: 'Erweitere auf den Nenner 6 und setze den zweiten Zähler in Klammern.', step: `${frac(lin(1, m), 2)} = ${frac(lin(3, 3 * m), 6)} und ${frac(lin(1, -n), 3)} = ${frac(lin(2, -2 * n), 6)}` });

function genFehler(lvl, ctx) {
  const t = R.int(0, 4);
  let lines, wrong, fix;
  if (t === 0) { const a = R.int(5, 9), b = R.int(2, a - 1), c = R.int(2, 9); lines = [`${a}x ${MINUS} (${b}x ${MINUS} ${c})`, `= ${a}x ${MINUS} ${b}x ${MINUS} ${c}`, `= ${a - b}x ${MINUS} ${c}`]; wrong = 1; fix = `Richtig wäre: = ${a}x ${MINUS} ${b}x + ${c}. Ein Minus vor der Klammer dreht ALLE Vorzeichen um.`; }

  else if (t === 2) { const k = R.int(2, 9); lines = [`(x + ${k})² ${MINUS} x²`, `= x² + ${k * k} ${MINUS} x²`, `= ${k * k}`]; wrong = 1; fix = `Richtig: (x + ${k})² = x² + ${2 * k}x + ${k * k}. Das Ergebnis ist ${2 * k}x + ${k * k}.`; }

  return { type: 'steps', q: 'Der Rechenroboter hat einen Fehler gemacht! Tippe auf die <b>erste falsche Zeile</b>.', lines, wrong, explain: fix, hint: 'Rechne jede Zeile selbst nach. Achte besonders auf Vorzeichen und Hochzahlen.' };
}

/* ---------- Quadratzahlen 0–20 und ihre Wurzeln ---------- */
const sqMax = lvl => lvl === 1 ? 10 : lvl === 2 ? 15 : 20;
const near = (v, max) => R.shuffle([v - 1, v + 1, v + 2, v - 2, v * 2, v + 10, v - 10].filter(x => x >= 0 && x !== v && x <= max));
function genQuadratBlitz(lvl, ctx) {
  const M = sqMax(lvl), n = R.int(0, M), q = n * n;
  const t = lvl === 1 ? R.pick([0, 1, 2, 3, 5]) : R.int(0, 5);
  if (t === 0) return { type: 'input', q: 'Berechne die Quadratzahl!', visual: `<div class="expr">${n}² = ?</div>`, fields: [exact(q)],
    explain: `${n}² = ${n} · ${n} = <b>${q}</b>`, hint: 'Quadrieren heißt: die Zahl mit sich selbst multiplizieren.', step: `${n} · ${n} = ?` };
  if (t === 1) return { type: 'input', q: 'Berechne die Quadratwurzel!', visual: `<div class="expr">${rt(q)} = ?</div>`, fields: [exact(n)],
    explain: `${rt(q)} = <b>${n}</b>, weil ${n} · ${n} = ${q}.`, hint: 'Welche Zahl mit sich selbst multipliziert ergibt die Zahl unter der Wurzel?', step: `Probiere: ${Math.max(0, n - 1)} · ${Math.max(0, n - 1)} = ${Math.max(0, n - 1) ** 2}` };
  if (t === 2) {
    const sq = R.chance(.5);
    if (sq) return choice(`Was ist <b>${n}²</b>?`, fmt(q), near(q, 400).map(fmt).concat([fmt(2 * n), fmt(n + n + 1)]), { fill: () => fmt(R.int(0, M) ** 2 + R.int(-3, 3)), explain: `${n}² = ${n} · ${n} = <b>${q}</b>. Achtung: ${n}² ist nicht ${n} · 2!`, hint: 'Quadrat = Zahl mal sich selbst.' });
    return choice(`Was ist <b>${rt(q)}</b>?`, fmt(n), near(n, 20).map(fmt).concat([fmt(q / 2)]), { fill: () => fmt(R.int(0, 20)), explain: `${rt(q)} = <b>${n}</b>, weil ${n}² = ${q}.`, hint: 'Die Wurzel ist die Umkehrung vom Quadrieren.' });
  }
  if (t === 3) {
    const isS = R.chance(.5), sqs = Array.from({ length: M + 1 }, (_, i) => i * i);
    let v; if (isS) v = R.pick(sqs.slice(2)); else { do { v = R.int(2, M * M); } while (sqs.includes(v)); }
    const f = Math.floor(Math.sqrt(v));
    return { type: 'tf', statement: `${v} ist eine Quadratzahl.`, answer: isS, explain: isS ? `${v} = ${Math.sqrt(v)}² = ${Math.sqrt(v)} · ${Math.sqrt(v)}.` : `${f}² = ${f * f} und ${f + 1}² = ${(f + 1) ** 2} – ${v} liegt dazwischen, ist also keine Quadratzahl.`, hint: 'Kennst du eine Zahl, die mit sich selbst multipliziert genau diese Zahl ergibt?' };
  }
  if (t === 4) {
    const a = R.int(1, M), b = R.int(0, M), op = R.int(0, 2);
    if (op === 0) return { type: 'input', q: 'Rechne im Kopf!', visual: `<div class="expr">${a}² + ${b}² = ?</div>`, fields: [exact(a * a + b * b)], explain: `${a * a} + ${b * b} = <b>${a * a + b * b}</b>`, hint: 'Zuerst beide Quadrate ausrechnen, dann addieren.', step: `${a}² = ${a * a}` };
    if (op === 1) return { type: 'input', q: 'Rechne im Kopf!', visual: `<div class="expr">${rt(a * a)} + ${rt(b * b)} = ?</div>`, fields: [exact(a + b)], explain: `${rt(a * a)} = ${a}, ${rt(b * b)} = ${b} → <b>${a + b}</b>`, hint: 'Zuerst beide Wurzeln ziehen, dann addieren.', step: `${rt(a * a)} = ${a}` };
    return { type: 'input', q: 'Rechne im Kopf!', visual: `<div class="expr">${rt(a * a)} · ${b}² = ?</div>`, fields: [exact(a * b * b)], explain: `${rt(a * a)} = ${a}, ${b}² = ${b * b} → ${a} · ${b * b} = <b>${a * b * b}</b>`, hint: 'Wurzel und Quadrat zuerst, dann multiplizieren.' };
  }
  const neg = R.chance(.5);
  return { type: 'input', q: neg ? 'Achtung, Vorzeichen-Falle!' : 'Fehlende Zahl gesucht:', visual: neg ? `<div class="expr">(${MINUS}${n})² = ?</div>` : `<div class="expr">? ² = ${q}</div>`, fields: [exact(neg ? q : n)],
    explain: neg ? `(${MINUS}${n}) · (${MINUS}${n}) = <b>${q}</b> – minus mal minus ergibt plus!` : `<b>${n}</b>² = ${q}. (Auch (${MINUS}${n})² = ${q}, aber wir suchen die positive Zahl.)`, hint: neg ? 'Minus mal minus ergibt plus.' : 'Das ist dasselbe wie die Wurzel ziehen.' };
}
function genQuadratMemory(lvl) {
  const M = sqMax(lvl), count = lvl === 1 ? 5 : 6, pairs = [], used = new Set();
  const ns = R.sample(Array.from({ length: M + 1 }, (_, i) => i).filter(i => i > 0 || lvl > 1), count * 2);
  for (const n of ns) {
    if (pairs.length >= count) break;

    if (used.has(p[0]) || used.has(p[1])) continue;
    used.add(p[0]); used.add(p[1]); pairs.push(p);
  }
  return { type: 'memory', q: 'Finde die Paare: Quadrat oder Wurzel und ihr Ergebnis!', pairs, hint: 'n² = n · n und √(n²) = n' };
}

}

const Snd = {
  ctx: null,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } },
  tone(f, d, type = 'sine', vol = .13, delay = 0) {

    try {
      const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .03);
    } catch (e) { /* ignorieren */ }
  },
  ok() { this.tone(660, .12, 'triangle'); this.tone(990, .2, 'triangle', .13, .1); },
  bad() { this.tone(220, .22, 'sawtooth', .06); this.tone(160, .3, 'sawtooth', .06, .12); },
  click() { this.tone(520, .05, 'square', .04); },

  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .3, 'triangle', .13, i * .12)); },
  lose() { [392, 330, 262].forEach((f, i) => this.tone(f, .35, 'triangle', .1, i * .18)); },

let parts = [], fxRun = false;
function confetti(n = 60, x = innerWidth / 2, y = innerHeight * .45) {
  if (reduced) return;
  fx.width = innerWidth; fx.height = innerHeight;
  const cols = ['#ffd23f', '#ff4fa3', '#3de8c7', '#8b7bff', '#ffffff'];
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 7; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: 4 + Math.random() * 5, c: cols[i % cols.length], r: Math.random() * 6, life: 70 + Math.random() * 40 }); }
  if (!fxRun) { fxRun = true; requestAnimationFrame(fxLoop); }
}
function fxLoop() {
  fxc.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .25; p.vx *= .99; p.r += .2; p.life--; fxc.save(); fxc.translate(p.x, p.y); fxc.rotate(p.r); fxc.globalAlpha = Math.min(1, p.life / 30); fxc.fillStyle = p.c; fxc.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fxc.restore(); }
  if (parts.length) requestAnimationFrame(fxLoop); else { fxRun = false; fxc.clearRect(0, 0, fx.width, fx.height); }
}

  const g2 = x.createRadialGradient(w * .1, h * .9, 0, w * .1, h * .9, Math.max(w, h) * .6);
  g2.addColorStop(0, 'rgba(255,79,163,.16)'); g2.addColorStop(1, 'rgba(255,79,163,0)'); x.fillStyle = g2; x.fillRect(0, 0, w, h);

    el.addEventListener('pointermove', e => {

      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) drag.moved = true;
      if (drag.moved) { const b = box.getBoundingClientRect(), a = dotPos(drag.s, drag.i); tmp = [a[0], a[1], e.clientX - b.left, e.clientY - b.top]; draw(); }
    });
    const end = e => {
      if (!drag || drag.id !== e.pointerId) return;
      const d = drag; drag = null; tmp = null;
      try { el.releasePointerCapture(e.pointerId); } catch (_) { }
      if (d.moved) {
        const target = document.elementFromPoint(e.clientX, e.clientY);
        const t2 = target && target.closest('.mi');
        if (t2 && box.contains(t2) && t2.dataset.s !== d.s) { link(d, { s: t2.dataset.s, i: +t2.dataset.i }); sel = null; }
        draw(); return;
      }
      tapItem(d.s, d.i);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', () => { drag = null; tmp = null; draw(); });
    el.addEventListener('click', e => { if (e.detail === 0) tapItem(el.dataset.s, +el.dataset.i); });
  });
  function tapItem(s, i) {
    if (G.locked || checked) return;
    if (sel && sel.s !== s) { link(sel, { s, i }); sel = null; }
    else if (sel && sel.s === s && sel.i === i) sel = null;
    else { if (!sel) unlink(s, i); sel = { s, i }; }
    draw();
  }
  $('#mCheck').onclick = () => {
    if (G.locked || conn.size !== n) return;
    checked = true; sel = null;
    let ok = true; conn.forEach((r, l) => { if (r !== l) ok = false; });
    draw();
    const list = t.left.map((l, i) => `${l} ⟶ ${t.right[i]}`).join('<br>');
    answer(ok, { explain: (ok ? '' : 'Die gestrichelten Linien zeigen die richtigen Paare:<br>') + list + (t.hint && !ok ? `<br><i>${t.hint}</i>` : '') });
  };
  requestAnimationFrame(draw);
};

function dragChip(el, { onDrop, onTap }) {
  let st = null;
  el.addEventListener('pointerdown', e => { if (G.locked) return; st = { x: e.clientX, y: e.clientY, id: e.pointerId, drag: false }; try { el.setPointerCapture(e.pointerId); } catch (_) { } });
  el.addEventListener('pointermove', e => {
    if (!st || st.id !== e.pointerId) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.drag && Math.hypot(dx, dy) > 8) { st.drag = true; el.classList.add('dragging'); }
    if (st.drag) { el.style.transform = `translate(${dx}px,${dy}px)`; const tg = hitBin(e); $$('.bin').forEach(b => b.classList.toggle('hot', b === tg)); }
  });
  function hitBin(e) { el.style.visibility = 'hidden'; const tg = document.elementFromPoint(e.clientX, e.clientY); el.style.visibility = ''; return tg && tg.closest('.bin'); }
  el.addEventListener('pointerup', e => {
    if (!st || st.id !== e.pointerId) return;
    const was = st.drag; st = null;
    try { el.releasePointerCapture(e.pointerId); } catch (_) { }
    el.classList.remove('dragging'); el.style.transform = ''; $$('.bin').forEach(b => b.classList.remove('hot'));
    if (was) onDrop(hitBin(e)); else onTap();
  });
  el.addEventListener('pointercancel', () => { st = null; el.classList.remove('dragging'); el.style.transform = ''; });
  el.addEventListener('click', e => { if (e.detail === 0) onTap(); });
}

function svgPoint(svgEl, e) { const p = svgEl.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const m = svgEl.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 }; }
RENDER.numberline = (t, body) => {

  s.addEventListener('pointerdown', e => { down = true; try { s.setPointerCapture(e.pointerId); } catch (_) { } set(e); });

function gridBase(range = 6, size = 320) {
  const sc = size / (2 * range + 1), o = size / 2, X = x => o + x * sc, Y = y => o - y * sc;
  let g = '';
  for (let i = -range; i <= range; i++) { g += `<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="${size}" class="grid"/><line x1="0" y1="${Y(i)}" x2="${size}" y2="${Y(i)}" class="grid"/>`; if (i && i % 2 === 0) g += `<text x="${X(i)}" y="${o + 13}" text-anchor="middle" class="num">${fmt(i)}</text><text x="${o - 5}" y="${Y(i) + 3}" text-anchor="end" class="num">${fmt(i)}</text>`; }
  g += `<line x1="0" y1="${o}" x2="${size}" y2="${o}" class="axis"/><line x1="${o}" y1="0" x2="${o}" y2="${size}" class="axis"/><text x="${size - 6}" y="${o - 6}" text-anchor="end" class="num">x</text><text x="${o + 6}" y="10" class="num">y</text>`;
  return { g, X, Y, sc, size, range };
}
